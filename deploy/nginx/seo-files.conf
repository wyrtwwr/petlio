# Include this file inside the HTTPS `server {}` block for petfolio.ru.
# Exact-match locations take precedence over a generic SPA/static fallback.

location = /robots.txt {
    try_files $uri =404;
    types { }
    default_type text/plain;
    charset utf-8;
    charset_types text/plain;
}

location = /sitemap.xml {
    try_files $uri =404;
    types { }
    default_type application/xml;
    charset utf-8;
    charset_types application/xml;
}
